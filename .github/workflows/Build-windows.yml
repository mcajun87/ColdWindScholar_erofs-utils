name: Build Windows

on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

jobs:
  Build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            base-devel
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-g++
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkg-config
            mingw-w64-ucrt-x86_64-libxml2

      - name: Build erofs-utils
        shell: msys2 {0}
        run: |
          cd "$GITHUB_WORKSPACE"
          chmod +x build_windows.sh || true
          ./build_windows.sh

      - name: Upload artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: erofs-utils-windows
          path: target/Windows_*/**
