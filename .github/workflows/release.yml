name: Release

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'Whether to publish a GitHub Release'
        required: false
        type: boolean
        default: true
      version:
        description: 'Version'
        required: false
        default: 'v1.9.3-26080800'

jobs:
  release:
    if: ${{ inputs.release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release package
        run: |
          for name in $(ls); do
            chmod +x ${name}/*
            touch -c -d "2009-01-01 00:00:00" ${name}/*
            zip -9 -jy "${name}.zip" ${name}/* > /dev/null 2>&1
          done
          ls -lahR

      - name: Upload release
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          omitBodyDuringUpdate: true
          removeArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}
          name: ${{ inputs.version }}
          tag: ${{ inputs.version }}
          body: This release is built by github-action.
          artifacts: "*.zip"
